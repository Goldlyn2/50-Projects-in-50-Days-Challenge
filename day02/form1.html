<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: slategray;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0.12);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: tomato;
        }
    </style>
</head>
<body>
    <div class="form-container">
    <h1>Registration
         Form </h1>
    <form>
        <label for="First name">First name: </label>
        <input type="text" name="First name" id="name" placeholder="Input first name">
        <br><br>
        <label for="Last name">Last name: </label>
        <input type="text" name="Last name" id="name" placeholder="Input last name">
        <br><br>
        <label for="Email">Email: </label>
        <input type="email" name="email" id="email" placeholder="Enter email">
        <br><br>
        <label for="password">Password: </label>
        <input type="password" name="password" id="password" placeholder=" Insert password">
        <br><br>
        <div>
        <button type="button" onclick="window.location.href='form2.html'">Next</button>
        </div>
    </div>
    </form>

</html>
